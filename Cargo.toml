[package]
name = "conda-src"
version = "0.1.0"
description = "Conda 镜像源切换桌面工具（PKU / 官方源 / USTC / 自定义源）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "5"
chrono = "0.4"
futures = "0.3"
